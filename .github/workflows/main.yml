name: Central das Ofertas

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rodar-ofertas:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar requests
        run: pip install requests

      - name: Executar sistema
        env:
          ID_DO_APLICATIVO_SHOPEE: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
        run: python newfile.py

      - name: Salvar ofertas no GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ofertas_prontas.txt ofertas_enviadas.txt
          git commit -m "Atualizar ofertas" || echo "Nada novo para salvar"
          git pull --rebase origin main
          git push origin main
