name: Central das Ofertas

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

# Permite que o GitHub Actions grave o histórico no repositório
permissions:
  contents: write

jobs:
  rodar-ofertas:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install requests

      - name: Executar sistema
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
        run: |
          python newfile.py

      - name: Salvar histórico no GitHub
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ofertas_enviadas.json
          git add ofertas_para_postar.txt

          git diff --cached --quiet || git commit -m "Atualizar ofertas e histórico"

          git push
